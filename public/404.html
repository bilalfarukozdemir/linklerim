<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sayfa bulunamadı</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eeeae3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1219" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%94%97%3C/text%3E%3C/svg%3E">
<style>
:root{
	color-scheme: light;
	--bg:      #eeeae3;
	--surface: #fbf8f1;
	--border:  #d6cebd;
	--text:    #111720;
	--muted:   #5d6470;
	--accent:  #a8884a;
	--shadow:  0 1px 2px rgba(22, 24, 29, .05);
}
@media (prefers-color-scheme: dark){
	:root{
		color-scheme: dark;
		--bg:      #0d1219;
		--surface: #18222e;
		--border:  #2b3948;
		--text:    #f1ece0;
		--muted:   #a3abb6;
		--accent:  #d9b45f;
		--shadow:  0 1px 2px rgba(0, 0, 0, .35);
	}
}
*, *::before, *::after{ box-sizing: border-box; }
body{
	margin: 0;
	min-height: 100vh;
	display: grid;
	place-items: center;
	padding: 1.5rem;
	background: var(--bg);
	color: var(--text);
	font: 400 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
	      "Helvetica Neue", Arial, sans-serif;
	-webkit-font-smoothing: antialiased;
}
main{ text-align: center; max-width: 24rem; }
.code{
	font-size: .75rem;
	font-weight: 600;
	letter-spacing: .12em;
	color: var(--muted);
	margin: 0 0 .75rem;
}
h1{
	margin: 0 0 .5rem;
	font-size: 1.375rem;
	font-weight: 650;
	letter-spacing: -.02em;
}
p{ margin: 0 0 1.75rem; color: var(--muted); font-size: .9375rem; }
a{
	display: inline-block;
	padding: .75rem 1.5rem;
	border: 1px solid var(--border);
	border-radius: 14px;
	background: var(--surface);
	box-shadow: var(--shadow);
	color: inherit;
	font-size: .9375rem;
	font-weight: 550;
	text-decoration: none;
	transition: transform .18s cubic-bezier(.2, .7, .3, 1), border-color .18s ease;
}
@media (hover: hover){
	a:hover{ transform: translateY(-2px); border-color: var(--accent); }
}
a:active{ transform: translateY(0) scale(.985); }
a:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce){
	a{ transition: none; }
	a:hover{ transform: none; }
}
</style>
</head>
<body>
<main>
	<p class="code">404</p>
	<h1>Böyle bir sayfa yok</h1>
	<p>Aradığın link taşınmış ya da hiç var olmamış olabilir.</p>
	<a href="/">← Linklere dön</a>
</main>
</body>
</html>
