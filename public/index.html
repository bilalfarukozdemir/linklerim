<style>
/* ── Tema ───────────────────────────────────────────────────────────────
   İki tema da açıkça tanımlı. Media query sadece değerleri değiştirir. */
:root{
	color-scheme: light;
	--bg:            #fbfbfd;
	--surface:       #ffffff;
	--border:        #e4e6ee;
	--border-strong: #cfd4e2;
	--text:          #16181d;
	--muted:         #6b7080;
	--accent:        #4f7cff;
	--ring:          rgba(22, 24, 29, .08);
	--shadow:        0 1px 2px rgba(22, 24, 29, .05);
	--shadow-lift:   0 6px 20px -6px rgba(22, 24, 29, .18), 0 2px 6px -2px rgba(22, 24, 29, .08);
	--skeleton:      #eceef4;
	--icon-ring:     rgba(22, 24, 29, .10);
	/* color-mix desteklenmezse bu değerler kalır (sade ama bozuk değil) */
	--accent-tint:   var(--surface);
	--accent-border: var(--border-strong);
}
@media (prefers-color-scheme: dark){
	:root{
		color-scheme: dark;
		--bg:            #0d0f14;
		--surface:       #161a22;
		--border:        #262b36;
		--border-strong: #363d4d;
		--text:          #e8eaf0;
		--muted:         #8d93a5;
		--accent:        #6f92ff;
		--ring:          rgba(0, 0, 0, .5);
		--shadow:        0 1px 2px rgba(0, 0, 0, .35);
		--shadow-lift:   0 8px 24px -8px rgba(0, 0, 0, .7), 0 2px 6px -2px rgba(0, 0, 0, .4);
		--skeleton:      #1e232d;
		--icon-ring:     rgba(255, 255, 255, .14);
		--accent-tint:   var(--surface);
		--accent-border: var(--border-strong);
	}
}
@supports (color: color-mix(in srgb, red 10%, white)){
	:root{
		--accent-tint:   color-mix(in srgb, var(--accent) 7%, var(--surface));
		--accent-border: color-mix(in srgb, var(--accent) 50%, var(--border));
	}
}

/* ── Temel ──────────────────────────────────────────────────────────── */
*, *::before, *::after{ box-sizing: border-box; }

body{
	margin: 0;
	padding: max(2.5rem, env(safe-area-inset-top)) 1.25rem calc(2.5rem + env(safe-area-inset-bottom));
	background: var(--bg);
	color: var(--text);
	font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
	      "Helvetica Neue", Arial, "Noto Sans", sans-serif;
	-webkit-font-smoothing: antialiased;
	-webkit-text-size-adjust: 100%;
}

main{
	width: 100%;
	max-width: 30rem;
	margin: 0 auto;
}

/* ── Profil ─────────────────────────────────────────────────────────── */
.profile{
	text-align: center;
	margin-bottom: 2rem;
}

.avatar{
	width: 5.5rem;
	height: 5.5rem;
	margin: 0 auto .875rem;
	border-radius: 50%;
	overflow: hidden;
	background: var(--surface);
	box-shadow: 0 0 0 1px var(--border), var(--shadow);
}
.avatar img{
	display: block;
	width: 100%;
	height: 100%;
	object-fit: cover;
}
.avatar .initials{
	display: grid;
	place-items: center;
	width: 100%;
	height: 100%;
	background: var(--accent);
	color: #fff;
	font-size: 2rem;
	font-weight: 600;
	letter-spacing: .02em;
	user-select: none;
}

.name{
	margin: 0 0 .375rem;
	font-size: 1.375rem;
	font-weight: 650;
	letter-spacing: -.02em;
	line-height: 1.25;
}

.bio{
	margin: 0 auto;
	max-width: 24rem;
	color: var(--muted);
	font-size: .9375rem;
	line-height: 1.55;
	text-wrap: pretty;
}

/* ── Linkler ────────────────────────────────────────────────────────── */
.links{
	list-style: none;
	margin: 0;
	padding: 0;
	display: grid;
	gap: .75rem;
}

.link{
	display: grid;
	grid-template-columns: 1.75rem minmax(0, 1fr) 1.75rem;
	align-items: center;
	gap: .5rem;
	min-height: 3.5rem;
	padding: .875rem 1rem;
	border: 1px solid var(--border);
	border-radius: 14px;
	background: var(--surface);
	box-shadow: var(--shadow);
	color: inherit;
	font-size: .9688rem;
	font-weight: 550;
	text-decoration: none;
	-webkit-tap-highlight-color: transparent;
	transition: transform .18s cubic-bezier(.2, .7, .3, 1),
	            box-shadow .18s ease,
	            border-color .18s ease,
	            background-color .18s ease;
}

.link .emoji{
	font-size: 1.125rem;
	line-height: 1;
	text-align: center;
}

/* Hedef sitenin kendi favicon'u — yerel dosya, dışarıya istek gitmez.
   Hepsinin opak zemini var, o yüzden ince bir çerçeve kenarını belli ediyor. */
.link .icon{
	display: block;
	width: 1.375rem;
	height: 1.375rem;
	margin: 0 auto;
	border-radius: 6px;
	object-fit: cover;
	outline: 1px solid var(--icon-ring);
	outline-offset: -1px;
}

.link .title{
	text-align: center;
	overflow-wrap: anywhere;
}

.link .arrow{
	color: var(--muted);
	text-align: center;
	opacity: 0;
	transform: translateX(-.25rem);
	transition: opacity .18s ease, transform .18s ease;
}

@media (hover: hover){
	.link:hover{
		transform: translateY(-2px);
		border-color: var(--border-strong);
		box-shadow: var(--shadow-lift);
	}
	.link:hover .arrow{ opacity: .55; transform: translateX(0); }
}

.link:active{
	transform: translateY(0) scale(.985);
	box-shadow: var(--shadow);
	transition-duration: .07s;
}

.link:focus-visible{
	outline: 2px solid var(--accent);
	outline-offset: 3px;
}
.link:focus-visible .arrow{ opacity: .55; transform: translateX(0); }

/* Öne çıkan link: renkli zemin + kenarlık taşır.
   Başlık kasten accent renkte DEĞİL — accent üzerine metin iki temada da
   WCAG AA kontrastını geçmiyor. */
.link.featured{
	background: var(--accent-tint);
	border-color: var(--accent-border);
	font-weight: 600;
}

/* ── Durumlar ───────────────────────────────────────────────────────── */
.skeleton{
	background: var(--skeleton);
	border-radius: 14px;
	animation: pulse 1.6s ease-in-out infinite;
}
.skeleton.avatar{ border-radius: 50%; box-shadow: none; }
.skeleton.line{ height: .875rem; margin: 0 auto .625rem; border-radius: 6px; }
.skeleton.row{ height: 3.5rem; }
@keyframes pulse{ 0%, 100%{ opacity: 1 } 50%{ opacity: .45 } }

.message{
	padding: 1.25rem;
	border: 1px dashed var(--border-strong);
	border-radius: 14px;
	color: var(--muted);
	font-size: .9375rem;
	text-align: center;
}

footer{
	margin-top: 2.5rem;
	color: var(--muted);
	font-size: .75rem;
	text-align: center;
}
footer p{ margin: 0 0 .375rem; }
footer p:last-child{ margin-bottom: 0; }
footer a{
	color: inherit;
	text-decoration: underline;
	text-underline-offset: 2px;
	text-decoration-color: var(--border-strong);
	transition: color .18s ease, text-decoration-color .18s ease;
}
@media (hover: hover){
	footer a:hover{ color: var(--accent); text-decoration-color: currentColor; }
}
footer a:focus-visible{
	outline: 2px solid var(--accent);
	outline-offset: 2px;
	border-radius: 3px;
}

@media (prefers-reduced-motion: reduce){
	*, *::before, *::after{
		animation-duration: .001ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: .001ms !important;
	}
	.link:hover{ transform: none; }
	.link .arrow{ opacity: .3; transform: none; }
}
</style>
</head>
<body>

<main id="app" aria-busy="true">
	<!-- İskelet: links.json gelene kadar görünür, sonra JS ile değişir -->
	<div class="profile">
		<div class="avatar skeleton" aria-hidden="true"></div>
		<div class="skeleton line" style="width:9rem;height:1.25rem" aria-hidden="true"></div>
		<div class="skeleton line" style="width:14rem" aria-hidden="true"></div>
	</div>
	<div class="links" aria-hidden="true">
		<div class="skeleton row"></div>
		<div class="skeleton row"></div>
		<div class="skeleton row"></div>
		<div class="skeleton row"></div>
	</div>
	<noscript>
		<p class="message">Linkleri görmek için JavaScript gerekiyor.
		Listeye <a href="links.json">links.json</a> üzerinden de ulaşabilirsin.</p>
	</noscript>
</main>

<script>
(function () {
	"use strict";

	var app = document.getElementById("app");

	function el(tag, className, text) {
		var node = document.createElement(tag);
		if (className) node.className = className;
		if (text != null) node.textContent = text; // innerHTML yok: JSON'dan HTML enjekte edilemesin
		return node;
	}

	function initialsOf(name) {
		var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
		if (!parts.length) return "?";
		return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
	}

	function buildAvatar(profile) {
		var box = el("div", "avatar");
		var initials = el("span", "initials", initialsOf(profile.name));
		if (profile.avatar) {
			var img = el("img");
			img.src = profile.avatar;
			img.alt = profile.name ? profile.name + " profil fotoğrafı" : "Profil fotoğrafı";
			img.width = 176;
			img.height = 176;
			img.decoding = "async";
			// Dosya yoksa/yüklenmezse baş harflere düş
			img.addEventListener("error", function () { box.replaceChildren(initials); });
			box.appendChild(img);
		} else {
			box.appendChild(initials);
		}
		return box;
	}

	// Solda görünen işaret: varsa sitenin kendi ikonu, yoksa emoji.
	// İkon yolu "/" ile başlamak zorunda — dış URL'e izin vermiyoruz ki
	// sayfayı açan kimsenin IP'si üçüncü bir siteye düşmesin.
	function buildMark(link) {
		var emoji = el("span", "emoji", link.emoji || "");
		emoji.setAttribute("aria-hidden", "true");

		var yerelIkon = typeof link.icon === "string" &&
			link.icon.charAt(0) === "/" && link.icon.charAt(1) !== "/";
		if (!yerelIkon) return emoji;

		var img = el("img", "icon");
		img.src = link.icon;
		img.alt = ""; // dekoratif: başlık zaten yanında yazıyor
		img.width = 44;
		img.height = 44;
		img.decoding = "async";
		// Dosya silinmiş/bozuksa emojiye düş
		img.addEventListener("error", function () { img.replaceWith(emoji); });
		return img;
	}

	function buildLink(link) {
		var item = document.createElement("li");
		var anchor = el("a", link.featured ? "link featured" : "link");
		anchor.href = "/go/" + encodeURIComponent(link.slug);
		anchor.rel = "noopener";

		var arrow = el("span", "arrow", "↗");
		arrow.setAttribute("aria-hidden", "true");

		anchor.append(buildMark(link), el("span", "title", link.title), arrow);
		item.appendChild(anchor);
		return item;
	}

	function buildFooter(profile, credit) {
		var footer = el("footer");
		footer.appendChild(el("p", null,
			"© " + new Date().getFullYear() + (profile.name ? " " + profile.name : "")));

		if (credit && credit.label && /^https?:\/\//i.test(credit.url || "")) {
			var line = el("p");
			var anchor = el("a", null, credit.label);
			anchor.href = credit.url;
			anchor.rel = "noopener";
			line.append(anchor, document.createTextNode(" tarafından yapıldı"));
			footer.appendChild(line);
		}
		return footer;
	}

	function render(data) {
		var profile = (data && data.profile) || {};
		var links = Array.isArray(data && data.links) ? data.links : [];

		if (profile.name) document.title = profile.name + " — Linkler";
		if (/^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(profile.accent || "")) {
			document.documentElement.style.setProperty("--accent", profile.accent);
		}

		var header = el("div", "profile");
		header.appendChild(buildAvatar(profile));
		if (profile.name) header.appendChild(el("h1", "name", profile.name));
		if (profile.bio) header.appendChild(el("p", "bio", profile.bio));

		var list = el("ul", "links");
		links
			.filter(function (link) { return link && link.slug && link.title && link.url; })
			.forEach(function (link) { list.appendChild(buildLink(link)); });

		var footer = buildFooter(profile, data && data.credit);

		app.replaceChildren(header, list.children.length ? list : el("p", "message", "Henüz link eklenmedi."), footer);
		app.setAttribute("aria-busy", "false");
	}

	function fail() {
		app.replaceChildren(el("p", "message", "Linkler yüklenemedi. Sayfayı yenilemeyi dene."));
		app.setAttribute("aria-busy", "false");
	}

	fetch("links.json", { cache: "no-cache" })
		.then(function (response) {
			if (!response.ok) throw new Error("HTTP " + response.status);
			return response.json();
		})
		.then(render)
		.catch(fail);
})();
</script>
