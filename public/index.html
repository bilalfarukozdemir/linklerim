<style>
/* ── Tema ───────────────────────────────────────────────────────────────
   Renkler vitrincim.com ile aynı: lacivert, kâğıt, altın. */
:root{
	color-scheme: light;
	--bg:            #eeeae3;
	--surface:       #fbf8f1;
	--border:        #d6cebd;
	--border-strong: #a8884a;
	--text:          #111720;
	--muted:         #5d6470;
	--accent:        #a8884a;
	--navy:          #1d2b3a;
	--gold:          #d9b45f;
	--cream:         #f1e6cf;
	--tile:          #1d2b3a;
	--shadow:        0 1px 0 rgba(17, 23, 32, .08), 0 2px 6px -2px rgba(17, 23, 32, .12);
	--shadow-lift:   0 10px 22px -10px rgba(17, 23, 32, .4);
	--feature-bg:    #1d2b3a;
	--feature-text:  #f7f1e4;
	--feature-sub:   #c9c3b4;
	--feature-arrow: #d9b45f;
	--skeleton:      #dfd9cd;
	--glow:          transparent;
}
@media (prefers-color-scheme: dark){
	/* Gece: dükkân kapanmadı, vitrinin ışığı yanıyor. */
	:root{
		color-scheme: dark;
		--bg:            #0d1219;
		--surface:       #18222e;
		--border:        #2b3948;
		--border-strong: #d9b45f;
		--text:          #f1ece0;
		--muted:         #a3abb6;
		--accent:        #d9b45f;
		--tile:          #2a3d51;
		--shadow:        0 2px 6px -2px rgba(0, 0, 0, .5);
		--shadow-lift:   0 10px 24px -10px rgba(0, 0, 0, .8);
		--feature-bg:    #d9b45f;
		--feature-text:  #111720;
		--feature-sub:   #3f3620;
		--feature-arrow: #111720;
		--skeleton:      #1b2531;
		--glow:          rgba(246, 212, 138, .13);
	}
}

/* ── Yazı tipleri ───────────────────────────────────────────────────────
   Kendi alan adımızdan: sayfayı açanın IP'si font servisine düşmesin. */
@font-face{ font-family: "DM Serif Display"; font-display: swap; src: url(/fonts/dm-serif-display-latin-ext-400-normal.woff2) format("woff2");
	unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face{ font-family: "DM Serif Display"; font-display: swap; src: url(/fonts/dm-serif-display-latin-400-normal.woff2) format("woff2");
	unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face{ font-family: "DM Sans"; font-weight: 100 1000; font-display: swap; src: url(/fonts/dm-sans-latin-ext-wght-normal.woff2) format("woff2");
	unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face{ font-family: "DM Sans"; font-weight: 100 1000; font-display: swap; src: url(/fonts/dm-sans-latin-wght-normal.woff2) format("woff2");
	unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* ── Temel ──────────────────────────────────────────────────────────── */
*, *::before, *::after{ box-sizing: border-box; }

body{
	margin: 0;
	padding: 0 1rem;
	background: #c9a87c;
	color: var(--text);
	font: 400 16px/1.4 "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
	-webkit-font-smoothing: antialiased;
	-webkit-text-size-adjust: 100%;
}

/* Sahne pencereyi kaplar ve yerinde kalır; içerik üstünde kayar. */
body::before{
	content: "";
	position: fixed;
	inset: 0;
	z-index: -1;
	background: url(/sahne/telefon.webp) center top / cover no-repeat;
}
@media (prefers-color-scheme: dark){
	body::before{ filter: brightness(.68); }
}

main{
	display: flex;
	flex-direction: column;
	width: 100%;
	max-width: 30rem;
	min-height: 100vh;
	min-height: 100svh;
	margin: 0 auto;
	padding-top: 1.5rem;
}

/* ── Tabela ve fotoğraf ─────────────────────────────────────────────── */
.sign{
	padding: .875rem 1rem .625rem;
	background: var(--navy);
	border-radius: 4px;
	box-shadow: inset 0 0 0 1px rgba(217, 180, 95, .55), 0 10px 24px -10px rgba(0, 0, 0, .6);
	text-align: center;
}

.name{
	margin: 0;
	color: var(--gold);
	font: 400 1.75rem/1.1 "DM Serif Display", Georgia, serif;
	letter-spacing: .005em;
}

.bio{
	margin: .25rem 0 0;
	color: var(--cream);
	font-size: .875rem;
	letter-spacing: .01em;
	text-wrap: balance;
}

/* Telefonda fotoğrafın iki yanında raftaki nesneler görünür; bu yükseklik onlara yer açar. */
.portrait{
	display: grid;
	place-items: center;
	height: 10.5rem;
}

.avatar{
	width: 6.75rem;
	aspect-ratio: 1;
	border-radius: 50%;
	overflow: hidden;
	background: var(--surface);
	box-shadow: 0 0 0 3px var(--gold), 0 6px 14px rgba(0, 0, 0, .4);
}
.avatar img{
	display: block;
	width: 100%;
	height: 100%;
	object-fit: cover;
}
.avatar .initials{
	display: grid;
	place-items: center;
	width: 100%;
	height: 100%;
	background: var(--navy);
	color: var(--gold);
	font: 400 2rem "DM Serif Display", Georgia, serif;
	user-select: none;
}

/* ── Linkler ────────────────────────────────────────────────────────── */
.links{
	list-style: none;
	margin: 0;
	padding: 0;
	display: grid;
	gap: .375rem;
}

.link{
	display: grid;
	grid-template-columns: 2.5rem minmax(0, 1fr) 1rem;
	align-items: center;
	gap: .75rem;
	min-height: 3.375rem;
	padding: .3125rem .875rem .3125rem .4375rem;
	border: 1px solid var(--border);
	border-radius: 12px;
	background: var(--surface);
	box-shadow: var(--shadow);
	color: inherit;
	text-decoration: none;
	-webkit-tap-highlight-color: transparent;
	transition: transform .18s cubic-bezier(.2, .7, .3, 1),
	            box-shadow .18s ease,
	            border-color .18s ease,
	            background-color .18s ease;
}

.link .emoji,
.link .icon{
	display: block;
	width: 2.5rem;
	height: 2.5rem;
	border-radius: 9px;
	background: var(--tile);
}
.link .emoji{
	font-size: 1.25rem;
	line-height: 2.5rem;
	text-align: center;
}
/* Yerel dosya, dışarıya istek gitmez. İkonlar tek renk: tuğlanın zemini burada. */
.link .icon{
	padding: .625rem;
	object-fit: contain;
}

.link .text{ min-width: 0; }
.link .title{
	display: block;
	font-size: 1rem;
	font-weight: 650;
	line-height: 1.25;
	letter-spacing: -.005em;
	overflow-wrap: anywhere;
}
.link .desc{
	display: block;
	color: var(--muted);
	font-size: .8125rem;
	line-height: 1.3;
	overflow-wrap: anywhere;
}

.link .arrow{
	color: var(--accent);
	font-weight: 600;
	text-align: center;
	transition: transform .18s ease;
}

@media (hover: hover){
	.link:hover{
		transform: translateY(-2px);
		border-color: var(--border-strong);
		box-shadow: var(--shadow-lift);
	}
	.link:hover .arrow{ transform: translate(2px, -2px); }
}

.link:active{
	transform: translateY(0) scale(.985);
	box-shadow: var(--shadow);
	transition-duration: .07s;
}

.link:focus-visible{
	outline: 2px solid var(--accent);
	outline-offset: 3px;
}

/* Öne çıkan link: sayfanın tek dolu kartı, göz önce buraya gider. */
.link.featured{
	background: var(--feature-bg);
	border-color: var(--feature-bg);
	color: var(--feature-text);
}
.link.featured .desc{ color: var(--feature-sub); }
.link.featured .arrow{ color: var(--feature-arrow); }
/* Vitrincim logosunun kendi zemini var, tuğla istemez */
.link.featured .icon{ padding: 0; background: none; }

/* ── Durumlar ───────────────────────────────────────────────────────── */
.skeleton{
	background: var(--skeleton);
	border-radius: 12px;
	animation: pulse 1.6s ease-in-out infinite;
}
.skeleton.head{ height: 15.5rem; margin-bottom: .5rem; }
.skeleton.row{ height: 3.375rem; }
@keyframes pulse{ 0%, 100%{ opacity: 1 } 50%{ opacity: .45 } }

.message{
	padding: 1.25rem;
	border: 1px dashed var(--border-strong);
	border-radius: 12px;
	color: var(--muted);
	font-size: .9375rem;
	text-align: center;
}

/* Sahnenin üstünde her zaman okunsun diye kendi zemini var. */
footer{
	align-self: center;
	margin: auto 0 .375rem;
	padding: .1875rem .75rem;
	border-radius: 999px;
	background: rgba(17, 23, 32, .72);
	color: var(--cream);
	font-size: .6875rem;
	text-align: center;
}
footer p{ display: inline; margin: 0; }
footer p + p::before{ content: " · "; }
footer a{
	color: inherit;
	text-decoration: underline;
	text-underline-offset: 2px;
	text-decoration-color: var(--gold);
	transition: color .18s ease, text-decoration-color .18s ease;
}
@media (hover: hover){
	footer a:hover{ color: #fff; text-decoration-color: currentColor; }
}
footer a:focus-visible{
	outline: 2px solid var(--accent);
	outline-offset: 2px;
	border-radius: 3px;
}

/* ── Geniş ekran ────────────────────────────────────────────────────────
   Masaüstü sahnesi: nesneler iki yandaki raflarda, orta sütun boş. Daha dar
   ekranda yan raflar kırpılacağı için orada dikey sahne kullanılır. */
@media (min-width: 1100px) and (min-aspect-ratio: 3/2){
	body{ background: #1b2738; }
	body::before{ background-image: url(/sahne/masaustu.webp); }
	/* Tente sahnenin üst %19'u; tabela onun alt kenarına biner */
	main{ padding-top: max(6.4vw, 11.4vh); }
	.name{ font-size: 2.125rem; }
	.bio{ font-size: .9375rem; }
	.portrait{ height: 8.75rem; }
	.avatar{ width: 7rem; }
	footer{ margin-top: 1rem; }
}

/* ── Raftaki nesneler ───────────────────────────────────────────────────
   Her nesne bir bağlantı; üstüne gelince vitrincim.com başlığındaki gibi tek
   bir önizleme fotoğrafı imleci izler. Yalnız masaüstü sahnesinde var. */
.spots{ display: none; }
@media (min-width: 1100px) and (min-aspect-ratio: 3/2){
	.spots{ display: block; }
}
.spot{
	position: fixed;
	border-radius: 10px;
	transition: background-color .2s ease, box-shadow .2s ease;
}
.spot:hover,
.spot:focus-visible{
	background: rgba(246, 212, 138, .14);
	box-shadow: 0 0 28px 8px rgba(246, 212, 138, .22);
	outline: none;
}
.preview{
	position: fixed;
	left: 0;
	top: 0;
	z-index: 40;
	width: 17.5rem;
	border-radius: 14px;
	overflow: hidden;
	pointer-events: none;
	opacity: 0;
	transform: translate(-50%, -50%) scale(.9);
	transition: opacity .25s, transform .25s;
	box-shadow: 0 24px 60px rgba(17, 23, 32, .55);
}
.preview.open{ opacity: 1; transform: translate(-50%, -50%) scale(1); }
.preview img{ display: block; width: 100%; height: auto; }

@media (prefers-reduced-motion: reduce){
	*, *::before, *::after{
		animation-duration: .001ms !important;
		animation-iteration-count: 1 !important;
		transition-duration: .001ms !important;
	}
	.link:hover{ transform: none; }
}
</style>
</head>
<body>

<main id="app" aria-busy="true">
	<!-- İskelet: links.json gelene kadar görünür, sonra JS ile değişir -->
	<div class="skeleton head" aria-hidden="true"></div>
	<div class="links" aria-hidden="true">
		<div class="skeleton row"></div>
		<div class="skeleton row"></div>
		<div class="skeleton row"></div>
		<div class="skeleton row"></div>
	</div>
	<noscript>
		<p class="message">Linkleri görmek için JavaScript gerekiyor.
		Listeye <a href="links.json">links.json</a> üzerinden de ulaşabilirsin.</p>
	</noscript>
</main>

<script>
(function () {
	"use strict";

	var app = document.getElementById("app");

	function el(tag, className, text) {
		var node = document.createElement(tag);
		if (className) node.className = className;
		if (text != null) node.textContent = text; // innerHTML yok: JSON'dan HTML enjekte edilemesin
		return node;
	}

	function initialsOf(name) {
		var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
		if (!parts.length) return "?";
		return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
	}

	function buildAvatar(profile) {
		var box = el("div", "avatar");
		var initials = el("span", "initials", initialsOf(profile.name));
		if (profile.avatar) {
			var img = el("img");
			img.src = profile.avatar;
			img.alt = profile.name ? profile.name + " profil fotoğrafı" : "Profil fotoğrafı";
			img.width = 176;
			img.height = 176;
			img.decoding = "async";
			// Dosya yoksa/yüklenmezse baş harflere düş
			img.addEventListener("error", function () { box.replaceChildren(initials); });
			box.appendChild(img);
		} else {
			box.appendChild(initials);
		}
		return box;
	}

	// Solda görünen işaret: varsa sitenin kendi ikonu, yoksa emoji.
	// İkon yolu "/" ile başlamak zorunda — dış URL'e izin vermiyoruz ki
	// sayfayı açan kimsenin IP'si üçüncü bir siteye düşmesin.
	function buildMark(link) {
		var emoji = el("span", "emoji", link.emoji || "");
		emoji.setAttribute("aria-hidden", "true");

		var yerelIkon = typeof link.icon === "string" &&
			link.icon.charAt(0) === "/" && link.icon.charAt(1) !== "/";
		if (!yerelIkon) return emoji;

		var img = el("img", "icon");
		img.src = link.icon;
		img.alt = ""; // dekoratif: başlık zaten yanında yazıyor
		img.width = 44;
		img.height = 44;
		img.decoding = "async";
		// Dosya silinmiş/bozuksa emojiye düş
		img.addEventListener("error", function () { img.replaceWith(emoji); });
		return img;
	}

	function buildLink(link) {
		var item = document.createElement("li");
		// Aynı sekmede açılıyor: geri tuşu çalışsın ve uygulama içi
		// tarayıcılarda (Instagram, TikTok) yeni sekme tuhaflığı olmasın.
		// target="_blank" olmadığı için rel="noopener" da gereksiz.
		var anchor = el("a", link.featured ? "link featured" : "link");
		anchor.href = "/go/" + encodeURIComponent(link.slug);

		var arrow = el("span", "arrow", "↗");
		arrow.setAttribute("aria-hidden", "true");

		var text = el("span", "text");
		text.appendChild(el("span", "title", link.title));
		if (link.desc) text.appendChild(el("span", "desc", link.desc));

		anchor.append(buildMark(link), text, arrow);
		item.appendChild(anchor);
		return item;
	}

	function buildFooter(profile, credit) {
		var footer = el("footer");
		footer.appendChild(el("p", null,
			"© " + new Date().getFullYear() + (profile.name ? " " + profile.name : "")));

		if (credit && credit.label && /^https?:\/\//i.test(credit.url || "")) {
			var line = el("p");
			var anchor = el("a", null, credit.label);
			anchor.href = credit.url;
			line.append(anchor, document.createTextNode(" tarafından yapıldı"));
			footer.appendChild(line);
		}
		return footer;
	}

	// Masaüstü sahnesinin piksel ölçüsü: nesnelerin yeri yüzde olarak buna göre.
	var SCENE_W = 2752, SCENE_H = 1536;

	function buildSpots(links) {
		var items = links.filter(function (link) {
			return link && link.slug && link.title && link.url && link.active !== false && link.spot;
		});
		if (!items.length) return;

		var box = el("div", "spots");
		var preview = el("div", "preview");
		preview.setAttribute("aria-hidden", "true");
		var photo = el("img");
		photo.alt = "";
		preview.appendChild(photo);

		function moveTo(x, y) {
			// Fotoğraf hep sayfanın ortasına doğru açılır, ekran dışına taşmaz.
			var half = preview.offsetHeight / 2 + 12;
			var side = x < window.innerWidth / 2 ? 170 : -170;
			preview.style.left = (x + side) + "px";
			preview.style.top = Math.min(Math.max(y, half), window.innerHeight - half) + "px";
		}

		var anchors = items.map(function (link) {
			var anchor = el("a", "spot");
			anchor.href = "/go/" + encodeURIComponent(link.slug);
			anchor.setAttribute("aria-label", link.title);
			var image = new Image(); // ilk üzerine gelişte boş kutu görünmesin
			image.src = link.spot.preview;
			anchor.addEventListener("mouseenter", function (event) {
				photo.src = link.spot.preview;
				moveTo(event.clientX, event.clientY);
				preview.classList.add("open");
			});
			anchor.addEventListener("mousemove", function (event) { moveTo(event.clientX, event.clientY); });
			anchor.addEventListener("mouseleave", function () { preview.classList.remove("open"); });
			anchor.addEventListener("focus", function () {
				var rect = anchor.getBoundingClientRect();
				photo.src = link.spot.preview;
				moveTo(rect.left + rect.width / 2, rect.top + rect.height / 2);
				preview.classList.add("open");
			});
			anchor.addEventListener("blur", function () { preview.classList.remove("open"); });
			box.appendChild(anchor);
			return { anchor: anchor, spot: link.spot };
		});

		// Sahne "cover" ve üstten hizalı: nesneler onunla aynı ölçekte kalsın.
		function place() {
			var width = document.documentElement.clientWidth, height = window.innerHeight;
			var scale = Math.max(width / SCENE_W, height / SCENE_H);
			var left = (width - SCENE_W * scale) / 2;
			anchors.forEach(function (item) {
				var s = item.spot, style = item.anchor.style;
				style.left = (left + SCENE_W * scale * s.x / 100) + "px";
				style.top = (SCENE_H * scale * s.y / 100) + "px";
				style.width = (SCENE_W * scale * s.w / 100) + "px";
				style.height = (SCENE_H * scale * s.h / 100) + "px";
			});
		}
		place();
		window.addEventListener("resize", place);
		document.body.append(box, preview);
	}

	function render(data) {
		var profile = (data && data.profile) || {};
		var links = Array.isArray(data && data.links) ? data.links : [];

		if (profile.name) document.title = profile.name + " — Linkler";
		if (/^#(?:[0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(profile.accent || "")) {
			document.documentElement.style.setProperty("--accent", profile.accent);
		}

		// Sahne CSS'te (body::before); burada yalnız tabela ve fotoğraf var.
		var header = el("div", "profile");
		var sign = el("div", "sign");
		if (profile.name) sign.appendChild(el("h1", "name", profile.name));
		if (profile.bio) sign.appendChild(el("p", "bio", profile.bio));
		var portrait = el("div", "portrait");
		portrait.appendChild(buildAvatar(profile));
		header.append(sign, portrait);

		var list = el("ul", "links");
		links
			.filter(function (link) { return link && link.slug && link.title && link.url && link.active !== false && !link.spot; })
			.forEach(function (link) { list.appendChild(buildLink(link)); });

		var footer = buildFooter(profile, data && data.credit);

		app.replaceChildren(header, list.children.length ? list : el("p", "message", "Henüz link eklenmedi."), footer);
		app.setAttribute("aria-busy", "false");
		buildSpots(links);
	}

	function fail() {
		app.replaceChildren(el("p", "message", "Linkler yüklenemedi. Sayfayı yenilemeyi dene."));
		app.setAttribute("aria-busy", "false");
	}

	fetch("links.json", { cache: "no-cache" })
		.then(function (response) {
			if (!response.ok) throw new Error("HTTP " + response.status);
			return response.json();
		})
		.then(render)
		.catch(fail);
})();
</script>
