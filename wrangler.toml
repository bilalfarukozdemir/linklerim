# Site Vercel'de barınıyor; bu dosya SADECE D1 komut satırı işleri için.
#   npx wrangler d1 execute linklerim-clicks --remote --command "SELECT * FROM clicks"
#
# `pages_build_output_dir` anahtarı bilerek yok: olsaydı wrangler bu dosyayı
# bir Cloudflare Pages projesinin üretim ayarı sanardı.

name = "linklerim"
